<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POC 2 — Typewriter Delete + Retype</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: #0F1923;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Outfit', sans-serif;
    overflow: hidden;
  }

  .hero-headline {
    font-size: clamp(40px, 5vw, 60px);
    font-weight: 800;
    line-height: 1.08;
    letter-spacing: -0.035em;
    color: #FFFFFF;
    text-align: center;
    max-width: 900px;
    padding: 0 24px;
  }

  .accent-wrapper {
    display: inline;
    position: relative;
  }

  .accent-text {
    color: #C3F73A;
    text-shadow: 0 0 60px rgba(195, 247, 58, 0.25);
  }

  .cursor {
    display: inline-block;
    width: 3px;
    height: 0.85em;
    background: #C3F73A;
    margin-left: 2px;
    vertical-align: baseline;
    position: relative;
    top: 0.08em;
    opacity: 0;
    box-shadow: 0 0 12px rgba(195, 247, 58, 0.4);
  }

  .cursor.visible {
    animation: blink 0.6s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0; }
  }

  .replay-btn {
    margin-top: 60px;
    padding: 12px 28px;
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    font-weight: 400;
    color: #FFFFFF;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 8px;
    cursor: pointer;
    transition: border-color 0.3s, color 0.3s;
  }

  .replay-btn:hover {
    border-color: #C3F73A;
    color: #C3F73A;
  }

  .label {
    position: fixed;
    top: 24px;
    left: 24px;
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.35);
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<div class="label">POC 2 — Typewriter Delete + Retype</div>

<h1 class="hero-headline">
  A céged következő<br>
  munkatársa<br>
  <span class="accent-wrapper">
    <span class="accent-text" id="accentText">nem ember lesz</span><span class="cursor" id="cursor"></span>
  </span>
</h1>

<button class="replay-btn" id="replayBtn">Replay</button>

<script>
  const accentText = document.getElementById('accentText');
  const cursor = document.getElementById('cursor');
  const replayBtn = document.getElementById('replayBtn');

  const oldPhrase = 'nem ember lesz';
  const newPhrase = 'AI alkalmazott lesz';
  const deleteSpeed = 55;
  const typeSpeed = 65;

  let animationTimer = null;

  function clearTimers() {
    if (animationTimer) clearTimeout(animationTimer);
  }

  function runAnimation() {
    clearTimers();
    accentText.textContent = oldPhrase;
    cursor.classList.remove('visible');

    // Wait 2s, then show cursor
    animationTimer = setTimeout(() => {
      cursor.classList.add('visible');

      // Small pause with blinking cursor before deleting
      animationTimer = setTimeout(() => {
        deleteChars(oldPhrase.length);
      }, 600);
    }, 2000);
  }

  function deleteChars(remaining) {
    if (remaining <= 0) {
      // Pause then start typing new text
      animationTimer = setTimeout(() => {
        typeChars(0);
      }, 300);
      return;
    }

    animationTimer = setTimeout(() => {
      accentText.textContent = oldPhrase.substring(0, remaining - 1);
      deleteChars(remaining - 1);
    }, deleteSpeed);
  }

  function typeChars(index) {
    if (index > newPhrase.length) {
      // Done typing — keep cursor blinking briefly, then hide
      animationTimer = setTimeout(() => {
        cursor.classList.remove('visible');
      }, 1500);
      return;
    }

    animationTimer = setTimeout(() => {
      accentText.textContent = newPhrase.substring(0, index);
      typeChars(index + 1);
    }, typeSpeed);
  }

  replayBtn.addEventListener('click', runAnimation);
  runAnimation();
</script>

</body>
</html>
