<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POC 3 — Slide-Out / Slide-In</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: #0F1923;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Outfit', sans-serif;
    overflow: hidden;
  }

  .hero-headline {
    font-size: clamp(40px, 5vw, 60px);
    font-weight: 800;
    line-height: 1.08;
    letter-spacing: -0.035em;
    color: #FFFFFF;
    text-align: center;
    max-width: 900px;
    padding: 0 24px;
  }

  .accent-wrapper {
    display: inline-block;
    position: relative;
    overflow: hidden;
    vertical-align: bottom;
    /* Height will be set by JS to match one line of text */
  }

  .accent-track {
    display: flex;
    flex-direction: column;
    transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .accent-old, .accent-new {
    color: #C3F73A;
    text-shadow: 0 0 60px rgba(195, 247, 58, 0.25);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .accent-track.slid {
    transform: translateY(-50%);
  }

  .replay-btn {
    margin-top: 60px;
    padding: 12px 28px;
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    font-weight: 400;
    color: #FFFFFF;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 8px;
    cursor: pointer;
    transition: border-color 0.3s, color 0.3s;
  }

  .replay-btn:hover {
    border-color: #C3F73A;
    color: #C3F73A;
  }

  .label {
    position: fixed;
    top: 24px;
    left: 24px;
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.35);
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<div class="label">POC 3 — Slide-Out / Slide-In</div>

<h1 class="hero-headline">
  A céged következő<br>
  munkatársa<br>
  <span class="accent-wrapper" id="wrapper">
    <span class="accent-track" id="track">
      <span class="accent-old">nem ember lesz</span>
      <span class="accent-new">AI alkalmazott lesz!</span>
    </span>
  </span>
</h1>

<button class="replay-btn" id="replayBtn">Replay</button>

<script>
  const wrapper = document.getElementById('wrapper');
  const track = document.getElementById('track');
  const replayBtn = document.getElementById('replayBtn');

  function setWrapperHeight() {
    const oldEl = track.querySelector('.accent-old');
    const lineHeight = oldEl.offsetHeight;
    wrapper.style.height = lineHeight + 'px';
  }

  function runAnimation() {
    track.classList.remove('slid');

    // Force reflow so transition resets
    void track.offsetHeight;

    setWrapperHeight();

    setTimeout(() => {
      track.classList.add('slid');
    }, 2000);
  }

  window.addEventListener('resize', setWrapperHeight);
  replayBtn.addEventListener('click', runAnimation);

  // Wait for font to load
  document.fonts.ready.then(() => {
    runAnimation();
  });
</script>

</body>
</html>
