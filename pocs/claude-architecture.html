<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code Architecture — 4YES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --warm:#EEECEA;--white:#FFFFFF;--dark:#0F1923;--accent:#C3F73A;
  --body:#555F6A;--caption:#8E969E;--radius:16px;
  --skill:#4A7BCC;--skill-bg:#E8EEF5;
  --plugin:#7B59C4;--plugin-bg:#EDE8F5;
  --mcp:#3FAA52;--mcp-bg:#E8F5EA;
  --workflow:#CC7A4A;--workflow-bg:#F5EDE8;
  --tool:#2AA5B8;--tool-bg:#E8F2F5;
  --hook:#CC4A4A;--hook-bg:#F5E8E8;
}
html{scroll-behavior:smooth}
body{font-family:'Outfit',sans-serif;background:var(--warm);color:var(--body);line-height:1.6;min-height:100vh}

/* HERO */
.hero{text-align:center;padding:56px 24px 40px;max-width:800px;margin:0 auto}
.hero h1{font-size:clamp(28px,5vw,42px);font-weight:800;color:var(--dark);letter-spacing:-0.5px;margin-bottom:8px}
.hero p{font-size:18px;color:var(--caption);font-weight:300}

/* SECTIONS */
.section{max-width:1200px;margin:0 auto;padding:0 24px 48px}
.section-title{font-size:22px;font-weight:700;color:var(--dark);margin-bottom:20px;display:flex;align-items:center;gap:10px}
.section-title::before{content:'';width:4px;height:24px;background:var(--accent);border-radius:2px;flex-shrink:0}

/* FLOW DIAGRAM */
.flow{display:flex;align-items:center;gap:0;justify-content:center;flex-wrap:wrap;padding:32px 0;margin-bottom:32px}
.flow-step{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 20px;border-radius:var(--radius);min-width:120px;text-align:center;position:relative}
.flow-step .flow-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:white}
.flow-step .flow-label{font-size:13px;font-weight:600;color:var(--dark)}
.flow-step .flow-sub{font-size:11px;color:var(--caption);font-weight:400;max-width:100px}
.flow-arrow{font-size:24px;color:var(--caption);padding:0 4px;flex-shrink:0}

/* SWIM LANES */
.swim-lanes{display:flex;flex-direction:column;gap:8px;margin-bottom:48px}
.swim-lane{display:flex;align-items:flex-start;gap:16px;padding:16px;border-radius:var(--radius);border:1px solid transparent;transition:border-color 0.2s}
.swim-lane:hover{border-color:rgba(0,0,0,0.06)}
.lane-label{min-width:120px;flex-shrink:0;display:flex;flex-direction:column;gap:2px}
.lane-label .lane-name{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px}
.lane-label .lane-count{font-size:11px;font-weight:400;color:var(--caption)}
.lane-pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{padding:5px 12px;border-radius:100px;font-size:12px;font-weight:500;cursor:pointer;transition:all 0.2s;border:none;white-space:nowrap}
.pill:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,0.12)}

/* CONTROLS */
.controls{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;align-items:center}
.tab-bar{display:flex;gap:4px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:100px;font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid transparent;background:var(--white);color:var(--body);transition:all 0.2s}
.tab:hover{border-color:var(--dark)}
.tab.active{background:var(--dark);color:var(--white);border-color:var(--dark)}
.search-box{flex:1;min-width:200px;position:relative}
.search-box input{width:100%;padding:9px 16px 9px 38px;border-radius:100px;border:1.5px solid #ddd;font-family:inherit;font-size:13px;background:var(--white);color:var(--dark);outline:none;transition:border-color 0.2s}
.search-box input:focus{border-color:var(--dark)}
.search-box::before{content:'⌕';position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--caption)}
.stats{font-size:12px;color:var(--caption);padding:8px 0}

/* CARDS */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.card{background:var(--white);border-radius:var(--radius);border:1.5px solid #e5e3e0;cursor:pointer;overflow:hidden;transition:all 0.2s}
.card:hover{border-color:#ccc;box-shadow:0 2px 12px rgba(0,0,0,0.06)}
.card.expanded{grid-column:1/-1;border-color:var(--dark)}
.card-header{padding:16px 20px;display:flex;align-items:flex-start;gap:12px}
.card-badge{padding:3px 10px;border-radius:100px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px;white-space:nowrap;flex-shrink:0}
.card-info{flex:1;min-width:0}
.card-name{font-size:15px;font-weight:600;color:var(--dark);margin-bottom:2px}
.card-short{font-size:13px;color:var(--body);line-height:1.4}
.card-chevron{font-size:14px;color:var(--caption);transition:transform 0.3s;flex-shrink:0;margin-top:4px}
.card.expanded .card-chevron{transform:rotate(180deg)}
.card-details{max-height:0;overflow:hidden;transition:max-height 0.4s ease}
.card.expanded .card-details{max-height:2000px}
.card-body{padding:0 20px 20px;border-top:1px solid #f0eeec}
.card-body h4{font-size:13px;font-weight:700;color:var(--dark);margin:16px 0 8px;text-transform:uppercase;letter-spacing:0.3px}
.card-body ul{list-style:none;padding:0}
.card-body li{font-size:13px;padding:4px 0;padding-left:16px;position:relative;line-height:1.5}
.card-body li::before{content:'›';position:absolute;left:0;color:var(--accent);font-weight:700}
.card-body p{font-size:13px;line-height:1.6;color:var(--body)}
.card-body .tag-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.card-body .tag{padding:2px 8px;border-radius:100px;font-size:11px;font-weight:500;background:#f0eeec;color:var(--body)}
.card-body .step{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #f5f3f1}
.card-body .step:last-child{border-bottom:none}
.card-body .step-num{width:22px;height:22px;border-radius:50%;background:var(--dark);color:var(--white);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.card-body .step-text{font-size:13px;line-height:1.5}
.card-body .tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;margin-top:4px}
.card-body .tool-item{padding:8px 12px;background:#faf9f8;border-radius:10px;font-size:12px;line-height:1.4}
.card-body .tool-item strong{color:var(--dark);font-weight:600}
.card-body .conn-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.card-body .conn{padding:3px 10px;border-radius:100px;font-size:11px;font-weight:500;cursor:pointer;transition:all 0.15s}
.card-body .conn:hover{transform:translateY(-1px)}

/* HOW IT WORKS */
.how-section{background:var(--white);border-radius:var(--radius);padding:32px;margin-bottom:48px;border:1.5px solid #e5e3e0}
.how-section h3{font-size:18px;font-weight:700;color:var(--dark);margin-bottom:16px}
.how-steps{display:flex;flex-direction:column;gap:12px}
.how-step{display:flex;gap:14px;align-items:flex-start}
.how-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:white;flex-shrink:0}
.how-text{flex:1}
.how-text strong{color:var(--dark);font-weight:600}

/* FOOTER */
.footer{text-align:center;padding:32px 24px 48px;font-size:12px;color:var(--caption)}

/* RESPONSIVE */
@media(max-width:768px){
  .swim-lane{flex-direction:column;gap:8px}
  .lane-label{min-width:auto;flex-direction:row;align-items:center;gap:8px}
  .card-grid{grid-template-columns:1fr}
  .flow{gap:4px}
  .flow-step{padding:10px 8px;min-width:80px}
  .flow-step .flow-sub{display:none}
  .controls{flex-direction:column}
  .search-box{min-width:auto;width:100%}
}
</style>

const state = {
  activeTab: 'all',
  searchQuery: '',
  expandedCards: new Set()
};


/* ═══════════════════════════════════════════
   UTILITY FUNCTIONS
   ═══════════════════════════════════════════ */
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text) e.textContent = text;
  return e;
}

function getLayerColor(layer) {
  return LAYERS[layer] ? LAYERS[layer].color : 'var(--body)';
}

function getLayerBg(layer) {
  return LAYERS[layer] ? LAYERS[layer].bg : '#f0f0f0';
}

function filteredComponents() {
  return COMPONENTS.filter(c => {
    const matchTab = state.activeTab === 'all' || c.layer === state.activeTab;
    if (!matchTab) return false;
    if (!state.searchQuery) return true;
    const q = state.searchQuery.toLowerCase();
    return c.name.toLowerCase().includes(q) ||
           c.short.toLowerCase().includes(q) ||
           c.category.toLowerCase().includes(q);
  });
}


/* ═══════════════════════════════════════════
   RENDER: FLOW DIAGRAM
   ═══════════════════════════════════════════ */
function renderFlowDiagram() {
  const container = document.getElementById('flow-diagram');
  container.textContent = '';

  const flowData = [
    { icon: '💬', label: 'Your Message', sub: 'Text prompt', color: 'var(--dark)' },
    { icon: '⚡', label: 'Hooks', sub: 'Pre-processing', color: 'var(--hook)' },
    { icon: '🎯', label: 'Skills', sub: 'Expertise loads', color: 'var(--skill)' },
    { icon: '🔌', label: 'Plugins', sub: 'Process discipline', color: 'var(--plugin)' },
    { icon: '📋', label: 'Workflows', sub: 'Step-by-step SOPs', color: 'var(--workflow)' },
    { icon: '🛠', label: 'MCP / Tools', sub: 'Execution', color: 'var(--mcp)' }
  ];

  const flow = el('div', 'flow');

  flowData.forEach((item, i) => {
    if (i > 0) {
      const arrow = el('span', 'flow-arrow', '→');
      flow.appendChild(arrow);
    }
    const step = el('div', 'flow-step');
    const icon = el('div', 'flow-icon');
    icon.textContent = item.icon;
    icon.style.backgroundColor = item.color;
    const label = el('div', 'flow-label', item.label);
    const sub = el('div', 'flow-sub', item.sub);
    step.appendChild(icon);
    step.appendChild(label);
    step.appendChild(sub);
    flow.appendChild(step);
  });

  container.appendChild(flow);
}


/* ═══════════════════════════════════════════
   RENDER: SWIM LANES
   ═══════════════════════════════════════════ */
function renderSwimLanes() {
  const container = document.getElementById('swim-lanes');
  container.textContent = '';

  Object.entries(LAYERS).forEach(([layerKey, layerConf]) => {
    const items = COMPONENTS.filter(c => c.layer === layerKey);
    const lane = el('div', 'swim-lane');
    lane.style.backgroundColor = layerConf.bg;

    const label = el('div', 'lane-label');
    const name = el('div', 'lane-name', layerConf.label);
    name.style.color = layerConf.color;
    const count = el('div', 'lane-count', items.length + ' component' + (items.length !== 1 ? 's' : ''));
    label.appendChild(name);
    label.appendChild(count);
    lane.appendChild(label);

    const pills = el('div', 'lane-pills');
    items.forEach(item => {
      const pill = el('button', 'pill', item.name);
      pill.style.backgroundColor = layerConf.color;
      pill.style.color = '#fff';
      pill.addEventListener('click', () => {
        state.activeTab = layerKey;
        state.searchQuery = '';
        document.getElementById('search').value = '';
        state.expandedCards.clear();
        state.expandedCards.add(item.id);
        renderTabs();
        renderCards();
        setTimeout(() => {
          const cardEl = document.getElementById('card-' + item.id);
          if (cardEl) cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
      });
      pills.appendChild(pill);
    });
    lane.appendChild(pills);
    container.appendChild(lane);
  });
}


/* ═══════════════════════════════════════════
   RENDER: HOW IT WORKS
   ═══════════════════════════════════════════ */
function renderHowItWorks() {
  const container = document.getElementById('how-it-works');
  container.textContent = '';

  const title = el('h3', '', 'How It All Works');
  container.appendChild(title);

  const stepsData = [
    { color: 'var(--hook)', text: '<strong>Hooks fire first</strong> — Before your message is processed, session hooks run. Peon Ping plays a sound effect. Security hooks validate the request.' },
    { color: 'var(--skill)', text: '<strong>Skills are checked</strong> — Claude scans your message for skill triggers. Asking about Webflow? webflow-mcp-expert loads. Building UI? frontend-design activates. Multiple skills can load at once.' },
    { color: 'var(--plugin)', text: '<strong>Plugins enforce discipline</strong> — The superpowers plugin requires brainstorming before coding, verification before completion. Other plugins add playgrounds, Figma integration, and iterative loops.' },
    { color: 'var(--workflow)', text: '<strong>Workflows guide execution</strong> — For Webflow tasks, Claude follows step-by-step SOPs from the workflows/ directory. Each workflow specifies which tools to call and in what order.' },
    { color: 'var(--mcp)', text: '<strong>MCP Servers execute</strong> — The actual work happens here. Webflow MCP creates pages and elements. Figma MCP reads designs. Playwright tests pages. Context7 fetches fresh documentation.' },
    { color: 'var(--tool)', text: '<strong>Local Tools handle the rest</strong> — Scraping websites, transforming data, running tests — anything outside Webflow goes through Python scripts and shell tools in the tools/ directory.' }
  ];

  const stepsContainer = el('div', 'how-steps');

  stepsData.forEach((s, i) => {
    const step = el('div', 'how-step');
    const num = el('div', 'how-num', String(i + 1));
    num.style.backgroundColor = s.color;
    const text = el('div', 'how-text');
    // Build text with bold parts using DOM
    const parts = s.text.split(/<\/?strong>/);
    parts.forEach((part, pi) => {
      if (pi % 2 === 1) {
        const b = el('strong', '', part);
        text.appendChild(b);
      } else {
        text.appendChild(document.createTextNode(part));
      }
    });
    step.appendChild(num);
    step.appendChild(text);
    stepsContainer.appendChild(step);
  });

  container.appendChild(stepsContainer);
}


/* ═══════════════════════════════════════════
   RENDER: TABS
   ═══════════════════════════════════════════ */
function renderTabs() {
  const container = document.getElementById('tab-bar');
  container.textContent = '';

  const tabs = [
    { key: 'all', label: 'All' },
    { key: 'skills', label: 'Skills' },
    { key: 'plugins', label: 'Plugins' },
    { key: 'mcp', label: 'MCP Servers' },
    { key: 'workflows', label: 'Workflows' },
    { key: 'tools', label: 'Tools' },
    { key: 'hooks', label: 'Hooks' }
  ];

  tabs.forEach(t => {
    const count = t.key === 'all' ? COMPONENTS.length : COMPONENTS.filter(c => c.layer === t.key).length;
    const tab = el('button', 'tab' + (state.activeTab === t.key ? ' active' : ''));
    tab.textContent = t.label + ' (' + count + ')';
    tab.addEventListener('click', () => {
      state.activeTab = t.key;
      state.expandedCards.clear();
      renderTabs();
      renderCards();
    });
    container.appendChild(tab);
  });
}


/* ═══════════════════════════════════════════
   RENDER: CARD DETAILS
   ═══════════════════════════════════════════ */
function buildCardDetails(comp) {
  const body = el('div', 'card-body');
  const d = comp.details;

  // Skills
  if (d.triggers) {
    const h = el('h4', '', 'When It Triggers');
    body.appendChild(h);
    const ul = el('ul');
    d.triggers.forEach(t => { const li = el('li', '', t); ul.appendChild(li); });
    body.appendChild(ul);
  }

  if (d.capabilities) {
    const h = el('h4', '', 'Capabilities');
    body.appendChild(h);
    const ul = el('ul');
    d.capabilities.forEach(t => { const li = el('li', '', t); ul.appendChild(li); });
    body.appendChild(ul);
  }

  // Plugins
  if (d.description) {
    const h = el('h4', '', 'Description');
    body.appendChild(h);
    const p = el('p', '', d.description);
    body.appendChild(p);
  }

  if (d.subSkills) {
    const h = el('h4', '', 'Sub-Skills');
    body.appendChild(h);
    const ul = el('ul');
    d.subSkills.forEach(s => {
      const li = el('li');
      const b = el('strong', '', s.name);
      li.appendChild(b);
      li.appendChild(document.createTextNode(' — ' + s.desc));
      ul.appendChild(li);
    });
    body.appendChild(ul);
  }

  // MCP Servers
  if (d.toolGroups) {
    const h = el('h4', '', 'Tool Inventory');
    body.appendChild(h);
    d.toolGroups.forEach(g => {
      const gh = el('h4', '');
      gh.style.fontSize = '12px';
      gh.style.color = 'var(--caption)';
      gh.style.marginBottom = '4px';
      gh.textContent = g.group;
      body.appendChild(gh);
      const grid = el('div', 'tool-grid');
      g.tools.forEach(t => {
        const item = el('div', 'tool-item', t);
        grid.appendChild(item);
      });
      body.appendChild(grid);
    });
  }

  // Workflows
  if (d.objective) {
    const h = el('h4', '', 'Objective');
    body.appendChild(h);
    const p = el('p', '', d.objective);
    body.appendChild(p);
  }

  if (d.trigger) {
    const h = el('h4', '', 'When to Use');
    body.appendChild(h);
    const p = el('p', '', d.trigger);
    body.appendChild(p);
  }

  if (d.inputs) {
    const h = el('h4', '', 'Required Inputs');
    body.appendChild(h);
    const ul = el('ul');
    d.inputs.forEach(t => { const li = el('li', '', t); ul.appendChild(li); });
    body.appendChild(ul);
  }

  if (d.steps) {
    const h = el('h4', '', 'Steps');
    body.appendChild(h);
    const stepsDiv = el('div');
    d.steps.forEach((s, i) => {
      const step = el('div', 'step');
      const num = el('div', 'step-num', String(i + 1));
      const text = el('div', 'step-text', s);
      step.appendChild(num);
      step.appendChild(text);
      stepsDiv.appendChild(step);
    });
    body.appendChild(stepsDiv);
  }

  if (d.mcpTools) {
    const h = el('h4', '', 'MCP Tools Used');
    body.appendChild(h);
    const tags = el('div', 'tag-list');
    d.mcpTools.forEach(t => {
      const tag = el('span', 'tag', t);
      tags.appendChild(tag);
    });
    body.appendChild(tags);
  }

  if (d.edgeCases) {
    const h = el('h4', '', 'Edge Cases');
    body.appendChild(h);
    const ul = el('ul');
    d.edgeCases.forEach(t => { const li = el('li', '', t); ul.appendChild(li); });
    body.appendChild(ul);
  }

  // Local Tools
  if (d.purpose) {
    const h = el('h4', '', 'Purpose');
    body.appendChild(h);
    const p = el('p', '', d.purpose);
    body.appendChild(p);
  }

  if (d.usage) {
    const h = el('h4', '', 'Usage');
    body.appendChild(h);
    const code = el('code', '', d.usage);
    code.style.display = 'block';
    code.style.padding = '10px 14px';
    code.style.background = '#faf9f8';
    code.style.borderRadius = '10px';
    code.style.fontSize = '12px';
    code.style.fontFamily = 'monospace';
    code.style.overflowX = 'auto';
    body.appendChild(code);
  }

  if (d.inputs && d.outputs && d.purpose) {
    // Already rendered inputs above for tools
    const h2 = el('h4', '', 'Outputs');
    body.appendChild(h2);
    const ul2 = el('ul');
    d.outputs.forEach(t => { const li = el('li', '', t); ul2.appendChild(li); });
    body.appendChild(ul2);
  }

  // Hooks
  if (d.event) {
    const pairs = [
      ['Event', d.event],
      ['Timing', d.timing],
      ['Timeout', d.timeout]
    ];
    const h = el('h4', '', 'Configuration');
    body.appendChild(h);
    const tags = el('div', 'tag-list');
    pairs.forEach(([k, v]) => {
      const tag = el('span', 'tag', k + ': ' + v);
      tags.appendChild(tag);
    });
    body.appendChild(tags);

    if (d.description) {
      const h2 = el('h4', '', 'What It Does');
      body.appendChild(h2);
      const p = el('p', '', d.description);
      body.appendChild(p);
    }
  }

  // Connections (all types)
  const conns = d.connections || comp.details.connections;
  if (conns && conns.length) {
    const h = el('h4', '', 'Connections');
    body.appendChild(h);
    const connList = el('div', 'conn-list');
    conns.forEach(c => {
      const conn = el('span', 'conn', c);
      // Try to find the target component for coloring
      const target = COMPONENTS.find(comp => comp.id === c || comp.name === c);
      if (target) {
        conn.style.backgroundColor = getLayerBg(target.layer);
        conn.style.color = getLayerColor(target.layer);
        conn.addEventListener('click', (e) => {
          e.stopPropagation();
          state.expandedCards.clear();
          state.expandedCards.add(target.id);
          // Switch tab if needed
          if (state.activeTab !== 'all' && state.activeTab !== target.layer) {
            state.activeTab = target.layer;
            renderTabs();
          }
          renderCards();
          setTimeout(() => {
            const cardEl = document.getElementById('card-' + target.id);
            if (cardEl) cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }, 100);
        });
      } else {
        conn.style.backgroundColor = '#f0eeec';
        conn.style.color = 'var(--body)';
      }
      connList.appendChild(conn);
    });
    body.appendChild(connList);
  }

  return body;
}


/* ═══════════════════════════════════════════
   RENDER: CARDS
   ═══════════════════════════════════════════ */
function renderCards() {
  const container = document.getElementById('card-grid');
  container.textContent = '';

  const filtered = filteredComponents();
  const statsEl = document.getElementById('stats');
  statsEl.textContent = 'Showing ' + filtered.length + ' of ' + COMPONENTS.length + ' components';

  filtered.forEach(comp => {
    const isExpanded = state.expandedCards.has(comp.id);
    const card = el('div', 'card' + (isExpanded ? ' expanded' : ''));
    card.id = 'card-' + comp.id;

    // Header
    const header = el('div', 'card-header');

    const badge = el('span', 'card-badge', LAYERS[comp.layer] ? LAYERS[comp.layer].label : comp.layer);
    badge.style.backgroundColor = getLayerBg(comp.layer);
    badge.style.color = getLayerColor(comp.layer);

    const info = el('div', 'card-info');
    const name = el('div', 'card-name', comp.name);
    const short = el('div', 'card-short', comp.short);
    info.appendChild(name);
    info.appendChild(short);

    const chevron = el('span', 'card-chevron', '▼');

    header.appendChild(badge);
    header.appendChild(info);
    header.appendChild(chevron);
    card.appendChild(header);

    // Details
    const details = el('div', 'card-details');
    if (isExpanded) {
      details.appendChild(buildCardDetails(comp));
    }
    card.appendChild(details);

    // Click handler
    card.addEventListener('click', () => {
      const wasExpanded = state.expandedCards.has(comp.id);
      if (wasExpanded) {
        state.expandedCards.delete(comp.id);
      } else {
        state.expandedCards.add(comp.id);
      }
      renderCards();
      if (!wasExpanded) {
        setTimeout(() => {
          const cardEl = document.getElementById('card-' + comp.id);
          if (cardEl) cardEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 50);
      }
    });

    container.appendChild(card);
  });
}


/* ═══════════════════════════════════════════
   RENDER: FOOTER
   ═══════════════════════════════════════════ */
function renderFooter() {
  const footer = document.getElementById('footer');
  const counts = {};
  Object.keys(LAYERS).forEach(k => { counts[k] = COMPONENTS.filter(c => c.layer === k).length; });
  footer.textContent = COMPONENTS.length + ' components — ' +
    counts.skills + ' skills, ' +
    counts.plugins + ' plugins, ' +
    counts.mcp + ' MCP servers, ' +
    counts.workflows + ' workflows, ' +
    counts.tools + ' tools, ' +
    counts.hooks + ' hooks';
}


/* ═══════════════════════════════════════════
   SEARCH HANDLER
   ═══════════════════════════════════════════ */
document.getElementById('search').addEventListener('input', function() {
  state.searchQuery = this.value;
  state.expandedCards.clear();
  renderCards();
});


/* ═══════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════ */
function init() {
  renderFlowDiagram();
  renderSwimLanes();
  renderHowItWorks();
  renderTabs();
  renderCards();
  renderFooter();
}

init();
</script>
